<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        body{
            background: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: "Helvetica Neue",sans-serif;
        }

        .card{
            position: relative;
            width: 200px;
            height: 300px;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 20px 60px rgba(0.4);
        }

        .bg-img{
            width: 100%;
            height: 100%;
            object-fit:cover;
            display: block;
        }
        .blurred-layer{
           position: absolute;
           bottom: 0;
           width: 100%;
           height: 100%;
           background-image: url("https://images.unsplash.com/photo-1771030668418-390b3edf33e4?w=600&auto=format&fit=crop&q=60&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxmZWF0dXJlZC1waG90b3MtZmVlZHwxNHx8fGVufDB8fHx8fA%3D%3D"); 
           background-size: cover;
           background-position: bottom;
           filter: blur(10px);
           z-index: 1;
           mask-image: linear-gradient(to top, rgba(0,0,0,1), rgba(0,0,0,0));
           mask-size: 100% 100%;
           mask-repeat: no-repeat;

           -webkit-mask-image: linear-gradient(
            to top, rgba(0,0,0,1),
            rgba(0,0,0,0)
           );

           -webkit-mask-size: 100% 100%;
           -webkit-mask-repeat: no-repeat;
        }
        .content{
            position: absolute;
            bottom: 20px;
            left:20px;
            color:white;
            z-index: 2;
        }
        .content h3{
            font-size: 18px;
            font-weight: bold;
            margin-bottom: 6px;
        }
        .content p {
            font-size: 14px;
            color:#ddd;
            line-height: 1.4;
        }
    </style>
</head>
